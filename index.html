<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gửi người đẹp nhe</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./assets/css.css">
</head>
<body>

    <div id="webgl-container"></div>

    <div class="top-bar">
        <button class="icon-btn" id="audio-btn" title="Bật/Tắt Nhạc"><i class="fas fa-music"></i></button>
        <button class="icon-btn" id="reset-cam-btn" title="Góc nhìn ban đầu"><i class="fas fa-compress-arrows-alt"></i></button>
    </div>

    <div class="click-hint">✨ Chạm vào lồng đèn để mở một lời chúc ✨</div>

    <div class="wish-modal" id="wishModal">
        <div class="wish-card">
            <button class="close-btn" id="closeWishBtn" aria-label="Đóng"><i class="fas fa-times"></i></button>
            <div class="wish-kicker">THÔNG ĐIỆP GỬI CẬU</div>
            <h3 id="wishTitle">Lời chúc đêm trăng</h3>
            <p id="wishText">"Chúc cậu đêm trăng ấm áp, dịu êm, ngập tràn vui."</p>
            <div class="tag">✦ TRUNG THU AN LÀNH ✦</div>
        </div>
    </div>

    <audio id="bgm" loop src="./assets/nhac.mp3"></audio>

    <script src="./assets/loi-nhan.js"></script>
    <script src="./assets/three.min.js"></script>
    <script src="./assets/OrbitControls.js"></script>
    <script src="./assets/script.js"></script>
</body>
</html>
